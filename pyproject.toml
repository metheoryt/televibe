[project]
name = "televibe"
version = "0.1.0"
description = "Run headless coding agents (Claude Code, Codex) one turn at a time, as resumable sessions with a typed event stream."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maxim Romanyuk", email = "metheoryt@gmail.com" }]
keywords = ["claude-code", "codex", "agents", "headless", "telegram", "aiogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
telegram = ["aiogram>=3.31,<4"]

[project.urls]
Homepage = "https://github.com/metheoryt/televibe"
Specification = "https://github.com/metheoryt/televibe/blob/main/SPEC.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/televibe"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "SPEC.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "aiogram>=3.31,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = ["live: runs a real agent CLI; skipped unless TELEVIBE_LIVE_<PROVIDER>_HOME is set"]

[tool.ty.environment]
python-version = "3.12"
python = "./.venv"
root = ["./src", "./tests"]

[tool.ty.src]
include = ["src", "tests"]
exclude = ["**/__pycache__", "build", "dist"]
respect-ignore-files = true

[tool.ty.terminal]
error-on-warning = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401", "E501"]   # no formatter yet; line length is not this config's job

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
